name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Сборка ничего не публикует: релизы собираются и подписываются локально
# (ключ не хранится в GitHub), поэтому токену хватает прав на чтение.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fkn-raspisanie-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fkn-raspisanie-release-unsigned
          path: app/build/outputs/apk/release/*.apk

      # Ловит две реальные поломки, которые уже случались:
      #  1) R8 вырезал сетевой код (APK без URL и без HttpURLConnection);
      #  2) из манифеста пропал InitializationProvider — WorkManager не
      #     инициализируется и приложение падает на старте.
      - name: Smoke-check release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "проверяю $APK"
          unzip -p "$APK" classes.dex > /tmp/app.dex

          grep -qa "raspisanie.artefamily.online" /tmp/app.dex \
            || { echo "::error::В dex нет URL расписания — сетевой код вырезан"; exit 1; }
          grep -qa "HttpURLConnection" /tmp/app.dex \
            || { echo "::error::В dex нет HttpURLConnection — загрузка расписания не работает"; exit 1; }
          grep -qa "store/artefamily/fknschedule/sync/TickReceiver" /tmp/app.dex \
            || { echo "::error::TickReceiver потерялся"; exit 1; }

          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -qa "androidx.startup.InitializationProvider" /tmp/manifest.txt \
            || { echo "::error::InitializationProvider удалён — WorkManager не инициализируется"; exit 1; }
          grep -qa "androidx.work.WorkManagerInitializer" /tmp/manifest.txt \
            || { echo "::error::WorkManagerInitializer отсутствует — приложение упадёт на старте"; exit 1; }